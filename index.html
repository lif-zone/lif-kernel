<html>
  <head>
    <script type=module>
      let lif;
      let has_sw = !!navigator.serviceWorker.controller;
      let retry = +localStorage.getItem('lif.boot.retry')||0;
      async function load_err(){
        if (lif || !navigator.serviceWorker.controller)
          return;
        console.log('lif boot failed loading - unreegister sw');
        let reg = await navigator.serviceWorker.getRegistrations();
        await Promise.all(reg.map(r=>r.update()));
        await Promise.all(reg.map(r=>r.unregister()));
        localStorage.setItem('lif.boot.retry', ''+Date.now());
        if (!retry || Date.now()-retry>10000){
          console.log('lif boot retry');
          window.location.reload(true);
        }
      }
      function load_timeout(){
        if (lif || !navigator.serviceWorker.controller)
          return;
        let res;
        setTimeout(()=>fetch_err(), 2000);
        try {
          res = fetch('__BOOT_JS__');
        } catch(err){
          res = {err};
        }
        function fetch_err(){
          if (res)
            return;
          load_err();
        }
      }
      if (has_sw)
        setTimeout(()=>load_timeout(), 2000);
      try {
        lif = (await import('__BOOT_JS__')).default;
      } catch(err){
        console.error('index.html boot', err);
        if (has_sw)
          await load_err();
        throw err;
      }
      await lif.boot.boot_app({lif: {webapp: '__WEBAPP__'}});
    </script>
  </head>
  <body>
  </body>
</html>
