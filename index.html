<html>
  <head>
    <script type=module>

// conf.lif_kernel_base: where the files of the kernel are: on this server
// (/.lif.lif-kernel), or a url of a cdn.
// The kernel (the service worker) is registered here, with that base, and
// boot.js and what it imports are loaded by the kernel:
// /.lif/npm/lif-kernel/. Where the kernel fetches them from is its business.
let boot_js = '/.lif/npm/lif-kernel/boot.js';

async function kernel_register(conf){
  let sw = navigator.serviceWorker;
  let q = new URLSearchParams({lif_kernel_base:
    new URL(conf.lif_kernel_base, location.href).href});
  if (localStorage.getItem('local_dev_enable'))
    q.set('local_dev_enable', 1);
  let url = new URL('/.lif.kernel_sw.js?'+q, location.href).href;
  await sw.register(url);
  await sw.ready;
  // a first load, or a kernel of another base: until this kernel takes the
  // page (its clients.claim())
  for (let i=0; i<100 && sw.controller?.scriptURL!=url; i++)
    await new Promise(resolve=>setTimeout(resolve, 100));
  if (sw.controller)
    return;
  console.log('no sw controller - reloading');
  location.reload();
  await new Promise(()=>{});
}

async function boot_full(conf){
  let lif;
  let has_sw = !!navigator.serviceWorker.controller;
  let retry = +localStorage.getItem('lif.boot.retry')||0;
  async function load_err(){
    if (lif || !navigator.serviceWorker.controller)
      return;
    console.log('lif boot failed loading - unreegister sw');
    if (localStorage.getItem('lif.boot.disable_load_err'))
      return;
    navigator.serviceWorker.controller.postMessage(
      {type: 'sw_boot_terminate'});
    let reg = await navigator.serviceWorker.getRegistrations();
    await Promise.all(reg.map(r=>r.update()));
    await Promise.all(reg.map(r=>r.unregister()));
    localStorage.setItem('lif.boot.retry', ''+Date.now());
    if (!retry || Date.now()-retry>10000){
      console.log('lif boot retry');
      window.location.reload(true);
    }
  }
  async function load_timeout(){
    if (lif || !navigator.serviceWorker.controller)
      return;
    let res, _err;
    setTimeout(()=>fetch_err(), 2000);
    try {
      res = await fetch(boot_js);
    } catch(err){
      _err = err;
    }
    function fetch_err(){
      if (res)
        return;
      load_err();
    }
  }
  if (has_sw)
    setTimeout(()=>load_timeout(), 2000);
  try {
    await kernel_register(conf);
    lif = (await import(boot_js)).default;
  } catch(err){
    console.error('index.html boot', err);
    if (has_sw)
      await load_err();
    throw err;
  }
  await lif.boot.boot_app(conf.boot_pkg);
}

let conf = __CONF__;
await boot_full(conf);

    </script>
  </head>
  <body>
  </body>
</html>
