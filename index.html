<html>
  <head>
    <!-- no icon to avoid requests to SW before its registered and loaded -->
    <link rel=icon href="data:,">
    <script type=module>

const clog = console.log.bind(console);
const cerror = console.error.bind(console);
const sw = navigator.serviceWorker;

// conf.lif_kernel_base: where the files of the kernel are: on this server
// (/.lif.lif-kernel), or a url of a cdn.
// The kernel (the service worker) is registered here, with that base, and
// boot.js and what it imports are loaded by the kernel:
// /.lif/npm/lif-kernel/. Where the kernel fetches them from is its business.
let boot_js = '/.lif/npm/lif-kernel/boot.js';

async function sw_unregister(){
  sw.controller?.postMessage({type: 'sw_boot_terminate'});
  let reg = await sw.getRegistrations();
  await Promise.all(reg.map(r=>r.update()));
  await Promise.all(reg.map(r=>r.unregister()));
}

async function kernel_register(conf){
  let lif_kernel_base = new URL(conf.lif_kernel_base, location.href).href;
  let q = new URLSearchParams({lif_kernel_base});
  if (localStorage.getItem('local_dev_enable'))
    q.set('local_dev_enable', 1);
  let url = new URL('/.lif.kernel_sw.js?'+q, location.href).href;
  if (sw.controller?.scriptURL==url)
    return 'ok';
  sw.addEventListener('statechange', ()=>{
    clog('sw statechange', event);
  });
  sw.addEventListener('controllerchange', ()=>{
    clog('sw controllerchange', event);
  });
  await sw.register(url);
  await sw.ready;
  let registration = await sw.getRegistration();
  if (!registration){
    cerror('sw failed registration '+url);
    await sw_unregister();
    return 'fail_register';
  }
  await registration.update();
  // Listen for new service worker
  registration.addEventListener('updatefound', ()=>{
    clog('sw update found');
    const newWorker = registration.installing;
    if (!newWorker)
      return;
    newWorker.addEventListener('statechange', event=>{
      clog('sw new worker event', event);
      if (newWorker.state=='installed')
        clog('new worker ready');
    });
  });
  // at first load, or a kernel of another base: until this kernel takes the
  // page (its clients.claim())
  for (let i=0; i<5000; i+=100){
    if (sw.controller?.scriptURL==url){
      clog('sw loaded '+url);
      return 'ok';
    }
    await new Promise(resolve=>setTimeout(resolve, 100));
  }
  if (!sw.controller){
    cerror('sw controller did not load');
    await sw_unregister();
    return 'no_sw';
  }
  cerror('sw did not change '+sw.controller.scriptURL+' -> '+url);
  await sw_unregister();
  return 'wrong_ver';
}

let lif;
let retry = +localStorage.getItem('lif.boot.retry')||0;
let in_load_error = 0;
async function load_error(err){
  if (lif || in_load_error)
    return;
  in_load_error = 1;
  clog('lif boot failed loading');
  sw_unregister();
  progress_error(err);
}

async function load_timeout(){
  if (lif)
    return;
  let res, _err;
  setTimeout(()=>fetch_err(), 2000);
  try {
    res = await fetch(boot_js);
  } catch(err){
    _err = err;
  }
  function fetch_err(){
    if (res)
      return;
    load_error('fetch_failed');
  }
}

async function boot_sw(conf){
  let res = await kernel_register(conf);
  if (res!='ok')
    throw res;
  setTimeout(()=>load_timeout(), 2000);
  try {
    lif = (await import(boot_js)).default;
  } catch(err){
    cerror('index.html boot failed', err);
    await load_error(err);
    throw err;
  }
  await lif.boot.boot_app(conf.boot_pkg);
}

// The data of the kernel only (its storage bucket, or its caches and
// indexedDBs): never the data of the application
async function kernel_data_clear(){
  let sb = navigator.storageBuckets;
  if (sb){
    for (let name of await sb.keys()){
      if (name.startsWith('lif-bucket-'))
        await sb.delete(name);
    }
    return;
  }
  for (let name of await caches.keys()){
    if (name.startsWith('lif-cache-'))
      await caches.delete(name);
  }
  for (let db of await indexedDB.databases?.()||[]){
    if (db.name.startsWith('lif-kernel-'))
      indexedDB.deleteDatabase(db.name);
  }
}

// A micro version of load_progress.js:load_error(): nothing is imported,
// since the kernel may be what failed.
function progress_error(err){
  let text = err instanceof Error ? err.message : ''+err;
  let stack = err?.stack;
  if (stack)
    text = stack.includes(text) ? stack : text+'\n'+stack;
  // a phone shows a page without a viewport meta smaller: enlarge the text
  let w = screen.width;
  let scale = w && innerWidth>w ? innerWidth/w : 1;
  let elm = document.createElement('div');
  elm.id = 'lif-error';
  elm.style.cssText = 'position:fixed;top:5%;left:5%;width:90%;height:90%;'
    +'z-index:2147483647;box-sizing:border-box;padding:24px;overflow:auto;'
    +'background:#fff;color:#222;border:1px solid #e74c3c;border-radius:8px;'
    +'font-family:sans-serif;font-size:'+16*scale+'px';
  let title = document.createElement('div');
  title.style.cssText = 'font-size:1.5em;color:#e74c3c';
  title.textContent = 'Load Error';
  let btn = document.createElement('button');
  btn.style.cssText = 'margin-top:12px;padding:6px 16px;font-size:0.875em;'
    +'cursor:pointer';
  btn.textContent = 'Clear and restart';
  btn.onclick = async()=>{
    btn.disabled = true;
    try {
      await sw_unregister();
      await kernel_data_clear();
    } catch(err){
      cerror('clear failed', err);
    }
    location.reload();
  };
  let pre = document.createElement('pre');
  pre.style.cssText = 'font-size:0.75em;white-space:pre-wrap;'
    +'word-break:break-word';
  pre.textContent = text;
  elm.append(title, btn, pre);
  document.body.appendChild(elm);
}

/* eslint-disable-next-line no-undef */
let conf = __CONF__;
try {
  await boot_sw(conf);
} catch(err){
  cerror(err);
  load_error(err);
}

    </script>
  </head>
  <body>
  </body>
</html>
